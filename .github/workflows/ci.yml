name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  structure-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository structure parity harness
        run: python -m pytest tests/repo_structure

  lint-type-test:
    runs-on: ubuntu-latest
    needs: structure-parity
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Type-check with mypy
        run: uv run mypy . --ignore-errors
      - name: Run tests
        run: uv run pytest
      - name: Detect secrets
        run: uv run detect-secrets scan
      - name: Audit dependencies
        run: uv run pip-audit -r requirements.txt
